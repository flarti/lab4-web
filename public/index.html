<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторна №4 — Дані користувача</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Робота з даними користувача</h1>
    <button id="themeBtn" type="button">Змінити тему</button>
  </header>

  <main>
    <p id="message" role="status"></p>

    <div id="guest" hidden>
      <section>
        <h2>Реєстрація</h2>
        <form id="registerForm">
          <label>Ім’я
            <input name="name" type="text" required minlength="2" maxlength="50" autocomplete="name">
          </label>
          <label>Email
            <input name="email" type="email" required autocomplete="email">
          </label>
          <label>Пароль (від 8 символів, літера і цифра)
            <input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
          </label>
          <button type="submit">Зареєструватися</button>
        </form>
      </section>

      <section>
        <h2>Вхід</h2>
        <form id="loginForm">
          <label>Email
            <input name="email" type="email" required autocomplete="email">
          </label>
          <label>Пароль
            <input name="password" type="password" required autocomplete="current-password">
          </label>
          <button type="submit">Увійти</button>
        </form>
      </section>
    </div>

    <div id="dashboard" hidden>
      <section>
        <h2 id="welcome"></h2>
        <button id="logoutBtn" type="button">Вийти</button>
      </section>
      <section>
        <h2>Мої нотатки</h2>
        <form id="noteForm">
          <label>Нова нотатка
            <textarea name="text" rows="3" required maxlength="500"></textarea>
          </label>
          <button type="submit">Зберегти</button>
        </form>
        <ul id="notes"></ul>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
