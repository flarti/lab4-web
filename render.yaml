# Blueprint для Render: створює веб-сервіс і базу PostgreSQL
databases:
  - name: lab5-db
    plan: free
    databaseName: lab5
    user: lab5

services:
  - type: web
    name: lab5-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lab5-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
